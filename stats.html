<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Licznik skanów</title>
<style>
  body { margin: 0; min-height: 100dvh; background: radial-gradient(circle at 50% 0, #3a2a6b, #0b0620 70%); color: #fff;
         font-family: system-ui, sans-serif; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); box-sizing: border-box; }
  main { max-width: 480px; margin: 0 auto; }
  h1 { color: #ffd84a; text-transform: uppercase; font-weight: 900; font-size: 28px; text-align: center; margin: 8px 0 24px;
       text-shadow: 0 3px 0 #b06a00; }
  .total { text-align: center; background: #ffffff14; border-radius: 20px; padding: 24px; margin-bottom: 16px; }
  .total b { display: block; font-size: 72px; color: #ffd84a; font-variant-numeric: tabular-nums; line-height: 1.1; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; background: #ffffff0f; border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; font-size: 18px; }
  li b { color: #ffd84a; font-variant-numeric: tabular-nums; }
  #reset { display: block; margin: 24px auto 0; padding: 12px 20px; border: 1px solid #ff6b6b88; border-radius: 99px;
           background: transparent; color: #ff8a8a; font-size: 16px; }
  p { color: #fff9; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Skany tagów NFC</h1>
  <div class="total">Wszystkie skany<b id="total">…</b></div>
  <ul id="tags"></ul>
  <p id="status">Odświeża się co 30 s</p>
  <button id="reset">Wyzeruj liczniki</button>
</main>
<script>
// Tag names: each NFC tag gets the link .../fortnite-token/?tag=N. Adding tags also needs index.html's /^[1-5]$/ check and a new counter key with admin key.
const TAGS = ['1', '2', '3', '4', '5'];
const BASE = 'https://abacus.jasoncameron.dev/';
const NS = 'fortnite-token-hm2026b/';
// "Key not found" = never scanned = 0; any other error (e.g. rate limit) = unknown, shown as "?".
const get = key => fetch(BASE + 'get/' + NS + key).then(r => r.json())
  .then(j => typeof j.value === 'number' ? j.value : j.error === 'Key not found' ? 0 : null).catch(() => null);
const fmt = v => v === null ? '?' : v;

document.getElementById('tags').innerHTML = TAGS.map(t => `<li>Tag ${t}<b id="tag-${t}">…</b></li>`).join('')
  + '<li>Bez tagu (zwykły link)<b id="other">…</b></li>';

async function refresh() {
  // "total" key holds visits without a tag; the big number is everything added up.
  const [other, ...per] = await Promise.all(['total', ...TAGS.map(t => 'tag-' + t)].map(get));
  const all = [other, ...per];
  const failed = all.includes(null);
  document.getElementById('total').textContent = failed ? '?' : all.reduce((a, b) => a + b, 0);
  document.getElementById('other').textContent = fmt(other);
  TAGS.forEach((t, i) => document.getElementById('tag-' + t).textContent = fmt(per[i]));
  document.getElementById('status').textContent = (failed ? 'Brak połączenia z licznikiem · ' : '')
    + 'Odświeżono ' + new Date().toLocaleTimeString('pl-PL');
}
refresh();
setInterval(refresh, 30000);

// Reset needs the admin code (kept out of this public repo); it's remembered on this device after first use.
document.getElementById('reset').onclick = async () => {
  let code = null;
  try { code = localStorage.getItem('resetCode'); } catch {}
  if (!code) code = prompt('Wklej kod resetu (z pliku kod-resetu-licznika.txt):');
  if (!code) return;
  let keys;
  try { keys = JSON.parse(atob(code.trim())); } catch { return alert('Nieprawidłowy kod.'); }
  if (!confirm('Wyzerować wszystkie liczniki? Tego nie da się cofnąć.')) return;
  const status = document.getElementById('status');
  status.textContent = 'Zeruję…';
  let failed = 0;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  for (const [key, admin] of Object.entries(keys)) {  // one by one, retrying: the API rate-limits bursts
    let ok = false;
    for (let i = 0; i < 6 && !ok; i++) {
      const r = await fetch(BASE + 'reset/' + NS + key, { method: 'POST', headers: { Authorization: 'Bearer ' + admin } }).catch(() => null);
      ok = !!r && r.ok;
      if (r && (r.status === 401 || r.status === 403)) break;  // wrong code: retrying won't help
      if (!ok) { status.textContent = 'Zeruję… (czekam na limit API)'; await wait(5000); }
    }
    if (!ok) failed++;
  }
  if (failed === 0) { try { localStorage.setItem('resetCode', code.trim()); } catch {} }
  else { try { localStorage.removeItem('resetCode'); } catch {} alert('Nie udało się wyzerować ' + failed + ' liczników. Sprawdź kod i spróbuj ponownie.'); }
  await wait(4000);  // let the API rate limit cool down before reading again
  refresh();
};
</script>
</body>
</html>
